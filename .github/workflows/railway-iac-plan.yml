name: Railway IaC Plan

on:
  push:
    branches:
      - main
    paths:
      - ".railway/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/admin/package.json"
      - "apps/web/package.json"
      - "packages/**/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-iac-production-plan
  cancel-in-progress: false

jobs:
  railway-iac-plan:
    name: railway-iac-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.57.6

      - name: Link the production project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway link --project 8bbaed6f-c14a-400b-b2a6-e4c332c31ed7 --environment production --json

      - name: Generate Railway plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config plan --out railway-plan.raw.json

      - name: Redact plan artifact
        run: node infra/scripts/redact-railway-plan.mjs railway-plan.raw.json railway-plan.json

      - name: Write safe plan summary
        run: |
          {
            echo "## Railway IaC plan"
            jq -r '
              def count($kind): [.changeSet.changes[]? | select(.kind == $kind)] | length;
              "- Resource changes: \([.changeSet.changes[]?] | length)\n- Creates: \(count("resource.create"))\n- Updates: \(count("resource.update"))\n- Deletes: \([.changeSet.changes[]? | select((.kind // "") | test("delete$"; "i"))] | length)\n- Diagnostics: \((.changeSet.diagnostics? // []) | length)\n- Destructive: \(.destructive // false)"
            ' railway-plan.raw.json
            echo
            echo "Plan values and textual diffs are redacted in the uploaded artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: railway-production-plan-${{ github.sha }}
          path: railway-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Reject unsafe Railway plan
        run: |
          jq -e '
            (.destructive == false)
            and (((.changeSet.diagnostics? // []) | length) == 0)
            and ([.changeSet.changes[]? | select((.kind // "") | test("delete$"; "i"))] | length == 0)
          ' railway-plan.raw.json >/dev/null || {
            echo "Railway plan contains diagnostics, destructive changes, or deletions." >&2
            exit 1
          }
