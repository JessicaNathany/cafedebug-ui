name: Railway IaC Plan

on:
  push:
    branches:
      - main
    paths:
      - ".railway/**"
      - "infra/scripts/*railway-plan*.mjs"
      - "infra/scripts/check-railway-config.mjs"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "apps/admin/package.json"
      - "apps/web/package.json"
      - "packages/**/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-iac-production-plan
  cancel-in-progress: false

jobs:
  railway-iac-plan:
    name: railway-iac-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require trusted main and production token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Railway plans must run from main." >&2; exit 1; }
          test -n "$RAILWAY_TOKEN" || { echo "Set RAILWAY_TOKEN in the production environment." >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.71.0

      - name: Link the production project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway link --project 8bbaed6f-c14a-400b-b2a6-e4c332c31ed7 --environment production --json

      - name: Generate Railway plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config plan --out railway-plan.raw.json

      - name: Validate UI plan and produce safe review output
        id: review
        run: node infra/scripts/validate-railway-plan.mjs railway-plan.raw.json railway-plan.json railway-plan-summary.md

      - name: Write safe plan summary
        if: ${{ always() && steps.review.outcome != 'skipped' && steps.review.outcome != '' }}
        run: |
          if test -f railway-plan-summary.md; then
            cat railway-plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload safe plan artifact
        if: ${{ always() && steps.review.outcome != 'skipped' && steps.review.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: railway-production-plan-${{ github.sha }}
          path: railway-plan.json
          if-no-files-found: error
          retention-days: 14
