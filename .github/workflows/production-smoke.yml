name: Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    environment: production
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
      ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
      API_PUBLIC_BASE_URL: ${{ vars.API_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify production endpoints
        run: bash infra/scripts/verify-production-smoke.sh
