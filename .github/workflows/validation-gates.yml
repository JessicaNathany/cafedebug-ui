name: Validation Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-gate:
    name: application-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm ci:web:build

      - name: Test website
        run: pnpm ci:web:test

      - name: Validate website
        run: pnpm ci:web:validate

      - name: Build backoffice
        run: pnpm ci:admin:build

      - name: Test backoffice
        run: pnpm ci:admin:test

      - name: Validate backoffice
        run: pnpm ci:admin:validate

      - name: Build website production image
        run: pnpm docker:web:build

      - name: Build backoffice production image
        run: pnpm docker:admin:build
